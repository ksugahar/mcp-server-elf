[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ELF-mcp-server"
version = "1.62.1"
description = "MCP server for ELF600 docs, public sample decks, and motor-design Python facade contracts: run queues, efficiency maps, dq/MTPA, PWM harmonics, NGSolve validation, RunResult parsing, optimization loops, drawing/BOM handoffs, and release-quality audits."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Kengo Sugahara", email = "ksugahar@ele.kindai.ac.jp"}]
keywords = ["mcp", "model-context-protocol", "elf", "elf600", "electromagnetic", "fem", "bem", "eddy-current", "magnetostatic", "magic", "elfin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov>=5,<8",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ksugahar/ELF-mcp-server"
Repository = "https://github.com/ksugahar/ELF-mcp-server"
Issues = "https://github.com/ksugahar/ELF-mcp-server/issues"
"ELF600 Vendor" = "https://www.science-solutions.jp/elf/"

[project.scripts]
elf-mcp-server = "elf_mcp_server.server:main"
elf-mcp-policy-lint = "elf_mcp_server.policy_lint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elf_mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "elf_mcp_server/THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/elf_mcp_server",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
