name: Validate release artifact

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to validate
        required: true
        type: string
      publish_to_pypi:
        description: Publish the validated artifact to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: python -m pip install --upgrade build pytest "twine>=7,<8"

      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: python scripts/check_release_tag.py "$RELEASE_TAG"

      - name: Install package
        run: python -m pip install -e .

      - name: Publish-boundary gate
        run: elf-mcp-policy-lint .

      - name: Run tests
        run: python -m pytest -q

      - name: Run selftest
        run: elf-mcp-server --selftest

      - name: Build sdist + wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Audit built wheel contents
        run: python -m elf_mcp_server.policy_lint . --wheel "dist/*.whl"

      - name: Test clean wheel installation
        run: |
          python -m venv .release-venv
          ./.release-venv/bin/python -m pip install dist/*.whl
          ./.release-venv/bin/elf-mcp-server --selftest

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI (Trusted Publisher)
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/elf-mcp-server/
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
